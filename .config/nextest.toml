[profile.default]
# Run every test and report every failure. A failing test still fails the run (exit code 100).
fail-fast = false

# Tests that put a seccomp filter on a child process, and the tests that stop every process which has more filters than their own (the reap of a
# sandboxed run), must not overlap: the reap would stop the other test's child. They run one at a time.
[test-groups]
seccomp-children = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(~sandbox_) | binary(=direct_messages_reap_sandboxed) | binary(=b790_loopback)'
test-group = 'seccomp-children'

# Every row with `threads-required = 'num-test-threads'` also has `priority = 100`: nextest starts the tests of the highest priority first, so
# these tests run at the start of a run, one after the other, when no test is in flight. In its place in the list such a test waited until every
# test in flight had ended while no other test could start: a test of 219 s in flight then cost the run up to that long on every test thread.
#
# A test that starts one busy thread per processor of the machine takes every test thread of the run: nextest starts it when no other test
# runs and starts no other test until it has ended.
[[profile.default.overrides]]
filter = 'binary(=fake_cline_inproc) & test(=b836_a_thousand_exchanges_beside_busy_threads_are_never_answered_from_the_queue)'
threads-required = 'num-test-threads'
priority = 100

# The cost test of the first process holds what the first-process role costs a turn under three times the noise that the same run measures: the
# difference between two turns without the role. That noise grows with whatever else the machine does, and the bound with it: alone on the build host the
# test held a turn under 20.6 to 27.7 ms, inside a full run of the worker's crate under 90.4 ms, so a cost that it catches alone passed beside the other
# tests. It gets every test thread of the run, as the stress test above does. The row costs a run the length of the test, in which no other test of the
# run works; with its priority it waits for no test in flight.
[[profile.default.overrides]]
filter = 'binary(=b883_first_process) & test(=b883_cost_a_turn_behind_process_1_against_process_1_serving_itself)'
threads-required = 'num-test-threads'
priority = 100

# The test of the uploads of a cost turn looks at six turns of the cost test's scenario and fails when their uploads wait for an acknowledgement: the
# turn times of the cost test above then sit on levels and say nothing about the first-process role. Whether a worker that leaves Nagle's algorithm on
# waits in a turn differs from machine to machine and with what else the machine does. So the test gets every test thread of the run, as the cost test
# does: its turns then meet what the turns of the cost test meet on the same machine.
[[profile.default.overrides]]
filter = 'binary(=b883_first_process) & test(=b965_the_uploads_of_a_cost_turn_do_not_wait_for_the_acknowledgement_of_their_head)'
threads-required = 'num-test-threads'
priority = 100

# Four tests with a time bound of their own failed a first pass of a full run on a loaded build host and passed alone: the draw of 5,000 agents of the client (0.505 s against its 0.5 s bound) and
# three copy tests of the worker, which wait for a copy that git processes make (a copy not seen within its 7 s, one notice more than expected, 18.66 s against 16 s). Their bounds stay as they
# are. Each gets every test thread of the run, as the stress test above does: it starts when no other test of the run works and no other test starts until it has ended, so the other tests of the
# run are no longer part of what it measures. What other processes of the host do is still part of it. A row is not free: it holds every test thread for the length of its test. Before the rows had
# a priority they also waited until the tests in flight had ended: the four rows then added about a third to the length of a full run on a 36-processor build host, the three rows of the worker
# about two thirds of that. The draw test keeps its row all the same: its clock leaves out the wait for a processor, but the draw itself is slower while other work shares the processors, and
# beside the other tests of a run that work is the run's own.
[[profile.default.overrides]]
filter = 'binary(=tui_w2) & test(=five_thousand_agents_draw_in_bounded_time)'
threads-required = 'num-test-threads'
priority = 100

# Since the draw test holds two bounds in the place of the 0.5 s above: the draws of each kind take under 6.7 times a yardstick, a fixed
# piece of work the test times just before every draw (under 9.3 times in a coverage build, which slows the code of a draw and not the
# yardstick), and wait under 0.05 s a draw. A busy machine slows the yardstick as it slows the draw, so the ratio says nearly the same
# alone and in a crowd. The test prints its build and what both bounds read in every run (DRAW-RATIOS).
[[profile.default.overrides]]
filter = 'binary(=tui_w2) & (test(=five_thousand_agents_draw_in_bounded_time))'
success-output = 'immediate'

[[profile.default.overrides]]
filter = 'binary(=b823_copies_run) & test(=b841_copy_a_copy_that_failed_is_tried_again_before_the_next_tick_of_a_long_timer)'
threads-required = 'num-test-threads'
priority = 100

[[profile.default.overrides]]
filter = 'binary(=b823_stop_copy) & test(=b823_a_look_that_hangs_in_git_add_is_given_up_its_git_is_ended_and_a_later_look_copies)'
threads-required = 'num-test-threads'
priority = 100

[[profile.default.overrides]]
filter = 'binary(=b823_stop_copy) & test(=b823_the_first_process_lets_the_look_in_flight_store_its_copy_and_copies_once_more)'
threads-required = 'num-test-threads'
priority = 100

# The tests of a look of the copy task that hangs print what they found. The three that run a real worker print what each late line of
# the worker states (STATED). The twenty-eight that drive the clock print the durations they imposed, the moment on that clock at which
# they saw the look said late or given up, the numbers of the worker's late line and what the run had been told (DRIVEN). nextest shows
# the output of a test that passed only when it is asked to (`success-output`, never by default).
[[profile.default.overrides]]
filter = 'binary(=b823_stop_copy) & (test(=b823_a_look_that_hangs_in_git_add_is_said_late_and_copies_when_the_tree_answers_again) | test(=b823_a_look_that_hangs_in_git_add_is_given_up_its_git_is_ended_and_a_later_look_copies) | test(=b823_a_look_is_given_up_when_the_file_system_of_the_tree_no_longer_answers) | test(=b893_a_look_is_said_late_at_the_set_limit_and_not_a_millisecond_before) | test(=b893_a_look_is_said_late_at_three_times_the_last_stored_look_and_not_a_millisecond_before) | test(=b893_a_look_that_is_given_up_before_the_set_limit_is_never_said_late) | test(=b893_a_look_that_is_given_up_before_three_times_the_last_stored_look_is_never_said_late) | test(=b893_the_run_is_told_nothing_before_the_set_limit) | test(=b893_the_run_is_told_nothing_before_three_times_the_last_stored_look) | test(=b893_the_run_is_told_at_the_set_limit) | test(=b893_the_run_is_told_at_three_times_the_last_stored_look) | test(=b893_a_look_is_said_late_411_ms_after_a_stored_look_of_137_ms_and_not_a_millisecond_before) | test(=b893_a_look_is_said_late_3_s_after_a_stored_look_of_1_s_and_not_a_millisecond_before) | test(=b893_a_look_that_is_given_up_before_411_ms_after_a_stored_look_of_137_ms_is_never_said_late) | test(=b893_a_look_that_is_given_up_before_3_s_after_a_stored_look_of_1_s_is_never_said_late) | test(=b893_a_late_line_waits_for_the_answer_of_a_tree_that_was_asked_before_the_limit) | test(=b893_a_late_line_at_the_set_limit_states_the_limit_whenever_the_tree_answers) | test(=b893_a_look_is_said_late_4500_ms_after_a_stored_look_of_1500_ms_and_not_a_millisecond_before) | test(=b893_the_first_look_of_a_worker_is_said_late_at_the_set_limit_and_not_a_millisecond_before) | test(=b893_the_first_look_of_a_worker_that_is_given_up_before_the_set_limit_is_never_said_late) | test(=b893_the_run_is_told_nothing_before_the_set_limit_of_the_first_look_of_a_worker) | test(=b893_the_run_is_told_at_the_set_limit_of_the_first_look_of_a_worker) | test(=b893_after_stored_looks_of_100_ms_and_200_ms_a_look_is_said_late_at_600_ms_and_not_at_400_ms) | test(=b893_after_stored_looks_of_200_ms_and_100_ms_a_look_is_said_late_at_400_ms) | test(=b893_a_look_that_stored_nothing_does_not_count_the_next_look_is_said_late_at_600_ms) | test(=b893_a_look_after_a_look_that_was_given_up_is_said_late_at_600_ms_and_the_run_is_told_nothing_more) | test(=b893_a_look_that_begins_150_ms_after_the_stored_look_ended_is_late_600_ms_after_its_own_start) | test(=b893_a_late_look_that_stored_a_copy_counts_and_the_next_late_look_tells_the_run_again) | test(=b893_two_late_looks_with_no_stored_copy_between_them_tell_the_run_once) | test(=b893_a_look_that_is_late_while_it_stores_is_said_late_at_600_ms_as_storing_the_copy) | test(=b893_a_look_that_waits_for_its_spacing_after_the_tick_is_late_from_its_own_start))'
success-output = 'immediate'

# The tests in `agentd/tests/b923_tree_question.rs` drive the clock as the tests do and print what they found (DRIVEN): when the copy task
# asks the file system of the work tree whether it answers, and the late limit of the look that follows a look which a request to end
# overtook.
[[profile.default.overrides]]
filter = 'binary(=b923_tree_question) & (test(=b923_a_look_late_at_600_ms_asks_its_tree_at_400_ms_and_is_given_up_at_5400_ms) | test(=b923_a_look_that_was_not_asked_to_end_asks_its_tree_at_1500_ms_before_its_late_limit_of_3000_ms) | test(=b923_the_look_after_a_first_look_of_200_ms_that_a_request_to_end_overtook_is_late_at_600_ms) | test(=b923_the_look_after_a_look_of_100_ms_that_a_request_to_end_overtook_is_late_at_400_ms) | test(=b923_a_look_late_at_400_ms_with_a_question_every_400_ms_is_said_late_at_400_ms_and_given_up_at_5400_ms) | test(=b923_ticks_while_a_look_stores_its_copy_ask_the_tree_nothing_and_the_copy_is_stored) | test(=b923_the_look_after_a_look_that_a_request_to_end_overtook_asks_its_tree_at_400_ms_and_is_given_up_at_5400_ms) | test(=b923_the_look_after_a_look_that_a_request_to_end_overtook_and_its_git_limit_gave_up_is_late_at_600_ms) | test(=b923_a_look_late_at_8700_ms_with_a_git_limit_of_8500_ms_asks_its_tree_at_3000_ms_and_is_given_up_at_8000_ms) | test(=b923_twelve_looks_in_a_row_late_at_400_ms_with_a_question_every_400_ms_are_each_said_late_before_their_question) | test(=b923_a_look_that_ends_at_its_late_limit_and_a_tick_of_5000_ms_is_not_said_late_and_does_not_ask_its_tree) | test(=b923_a_look_that_ends_at_a_tick_of_5000_ms_before_its_late_limit_of_6000_ms_does_not_ask_its_tree) | test(=b923_a_request_to_end_that_comes_with_a_tick_while_a_question_waits_is_taken_up_when_the_question_ends))'
success-output = 'immediate'

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 24" width="112" height="192" shape-rendering="crispEdges" role="img">
  <title>The ham mascot, rocket flame and smoke</title>
  <desc>The ham mascot, an original pixel drawing of an orange character with a rounded head, two large white eyes with black pupils that look up, a plain dark shirt with small orange arms, and tan shorts with a notch between the legs. It has no mouth and no lettering. A short flame burns under each foot, yellow in the core, orange at the edge and red at the tip, with grey smoke below the flames, as if it were a rocket.</desc>

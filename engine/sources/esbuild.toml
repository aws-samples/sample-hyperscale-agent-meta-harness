# esbuild 0.25.12, the bundler of the goal plugin. The native binary of each build platform comes from its npm package (a plain tarball of
# three files) and is pinned by the SHA-256 of the archive and of the binary inside it, so the build needs no Node, no npm and no npx. The
# archive hashes equal the registry's `integrity` (sha512) and `shasum` (sha1) of the packages.

# Cline's goal plugin, the loop the worker runs by default. The plugin source and its licence come from github.com/cline/plugins
# at one commit; createTool, the one function of the SDK the plugin calls, comes verbatim from the Cline source of cline.toml (the [[inputs]]
# table follows that pin). `engine-fetch build goal-plugin` bundles them with the pinned esbuild into the five files of the plugin folder and
# checks every file against engine/plugins/lock.json. Nothing of this plugin is stored in the repository.
schema = "1"
name = "goal-plugin"
kind = "git-path-bundle"
license = "Apache-2.0"
recipe = "esbuild-bundle"
description = "Cline goal plugin (plugins/goal) bundled with createTool of the Cline SDK"


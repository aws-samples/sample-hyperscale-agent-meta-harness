# OpenCode 2.2.6, the second engine: installed at /opt/harness/bin/opencode from the pinned release asset (engine/lock.toml).
# ACP through `opencode acp`; rows are the QG-O qualification set. 2.2.6 is the newest release with the /goal command (2.2.1 or later).
schemaVersion = 1
name = "opencode"
version = "2.2.6"
hiddenPaths = ["opencode.json", "opencode.jsonc", ".opencode/**"]
envRemove = ["AWS_BEARER_TOKEN_BEDROCK"]

[binary]
path = "/opt/harness/bin/opencode"
# engine/lock.toml [opencode].binarySha256
sha256 = "ce4f5e7502b6e32ccd8b05654410e8e8607b9660737222b0b1279621bcea2b03"

# OpenCode kill switches; config and state live under the per-session dirs. A name that is present is no proof that it works: the egress
# capture is that proof.
[env]
OPENCODE_DISABLE_AUTOUPDATE = "1"
OPENCODE_DISABLE_MODELS_FETCH = "1"
OPENCODE_DISABLE_CLAUDE_CODE = "1"
XDG_CONFIG_HOME = "{configDir}"
XDG_DATA_HOME = "{dataDir}/share"
XDG_CACHE_HOME = "{dataDir}/cache"
XDG_STATE_HOME = "{dataDir}/state"

# The harness tool server (code_search and the others) is handed to the engine in its inline configuration (OPENCODE_CONFIG_CONTENT), never
# through a file the engine could rewrite: agentd renders this template once the server answers, keeps the rendered file as the record of what
# was registered, and adds the entry to the inline layer after the modules ran (crates/agentd/src/engine/opencode.rs).
# 16000 characters (the most a table may name) stay under the engine's own cut of a tool result (51200 bytes).
[mcp]
via = "file"
path = "{dataDir}/settings/opencode-tools.json"
template = "engine/profiles/templates/mcp-opencode.json"
maxResultChars = 16000
shadow = []

[transports.acp]
argv = ["/opt/harness/bin/opencode", "acp"]
stdin = "pipe"
cancel = { method = "acp-cancel", killAfterS = 5 }

[gate]
name = "QG-O"

[[rows]]
id = "K0-O"
class = "gating"
local = true
check = "Local binary: ACP initialize and session/new succeed; agentInfo.version 2.2.6"
pass = { minPass = 1, runs = 1 }

[[rows]]
id = "K1-O"
class = "gating"
check = "microVM smoke on OpenCode: /ping HealthyBusy during the turn; hidden tests green on a clean clone; repo on /mnt/workspace"
pass = { minPass = 1, runs = 1 }

[[rows]]
id = "K3-O"
class = "gating"
check = "the model and every catalog route OpenCode serves pass one tool-using turn"
pass = { minPass = 1, runs = 1 }

[[rows]]
id = "K5-O"
class = "gating"
local = true
check = "cancel within 10 s and the next prompt succeeds"
pass = { minPass = 1, runs = 1, thresholds = { cancelWithinS = 10.0 } }

[[rows]]
id = "K6-O"
class = "gating"
check = "rules applied; repo opencode.json and .opencode/ quarantined; the repo hook's marker file is never written"
pass = { minPass = 1, runs = 1 }

[[rows]]
id = "K7-O"
class = "gating"
check = "reject-and-continue on OpenCode, counted as K7: 8 of 9 exercised runs within maxRuns; every run's diff only test_*.py with 0 reverts"
pass = { minPass = 8, runs = 9, thresholds = { maxRuns = 30.0 } }

[[rows]]
id = "K10-O"
class = "gating"
check = "egress capture on OpenCode: 0 alerts, flows or queries outside the allowlist"
pass = { minPass = 1, runs = 1 }

[[rows]]
id = "K13-O"
class = "gating"
check = "credential binding on OpenCode: every Bedrock call is harness-worker-session <run>.<agent>; broker stopped fails closed"
pass = { minPass = 1, runs = 1 }

[package]
name = "agentd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-credential-types.workspace = true
aws-sigv4.workspace = true
axum.workspace = true
bytes.workspace = true
flate2.workspace = true
harness-core.workspace = true
harness-protocol.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
rustls.workspace = true
hyper-util.workspace = true
landlock.workspace = true
libc.workspace = true
nix.workspace = true
pkgproxy.workspace = true
regex.workspace = true
rustix.workspace = true
seccompiler.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
# `signal`: the termination signals `agentd serve` answers with a copy of the work. It adds no package: `process` has its parts.
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
# Paused-clock tests of the flusher's tick timing.
tokio = { workspace = true, features = ["test-util"] }
# The processor clock of a thread (`CLOCK_THREAD_CPUTIME_ID`), read by the tests that hold the store of a copy off the runtime's
# threads (`tests/b860_store_stream.rs`). It adds no package.
# `net`, with which the stand-in of `tests/b970_no_delay.rs` asks the kernel to hold its acknowledgements back
# (`TCP_QUICKACK`). It adds no package.
# `thread`, with which the rig of `tests/direct_support` starts a worker on one processor (`Opts::one_processor`). It adds no
# package.
rustix = { workspace = true, features = ["time", "net", "thread"] }
# The same tests call the worker's connector as the service it is, to read the option of a connection it opens. It adds no
# package: hyper-util brings it.
tower-service.workspace = true

[[bin]]
name = "agentd"
path = "src/main.rs"

# The loop of the first process (`src/first.rs`) around any program, for the tests. No image copies it and it is no entry of the
# shipped program.
[[bin]]
name = "agentd-first-process-rig"
path = "src/bin/first_process_rig.rs"
test = false

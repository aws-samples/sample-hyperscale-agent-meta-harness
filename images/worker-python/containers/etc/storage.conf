# ham-containers: the vfs driver. The VM's root file system is itself an overlay, which the kernel refuses as an overlay
# upper layer, and tmpfs has no user xattrs (measured 2026-10-14, kernel 6.1.161); there is no FUSE for a userspace overlay and no loop device.
# vfs copies each layer, so images are flattened to one layer at build time (containers-assets.sh).
[storage]
driver = "vfs"
runroot = "/run/ham-containers/runroot"
graphroot = "/var/lib/ham-containers/storage"

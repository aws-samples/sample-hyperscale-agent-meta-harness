# ham-containers: Podman 6 inside a direct-run session. This file replaces the system containers.conf (CONTAINERS_CONF).
[containers]
# A new container joins the default bridge (a rootless netns with a netavark bridge and rootlessport for published ports).
# Without this a rootless container would use pasta, which needs /dev/net/tun, and the VM kernel has none.
netns = "bridge"
# The VM mounts cgroup2 read-only: no cgroup is created for a container.
cgroups = "disabled"
default_sysctls = []
log_driver = "k8s-file"
# The service's own proxy setting (it points at a closed port so that a pull fails at once) must not reach the containers.
http_proxy = false

[engine]
cgroup_manager = "cgroupfs"
runtime = "crun"
events_logger = "file"
helper_binaries_dir = ["/opt/harness/containers/lib", "/opt/harness/containers/bin"]
# conmon is looked up in conmon_path and on PATH only, and lib/ is not on PATH: name it, and the runtime, by full path.
conmon_path = ["/opt/harness/containers/lib/conmon"]
volume_path = "/var/lib/ham-containers/volumes"

[engine.runtimes]
crun = ["/opt/harness/containers/bin/crun"]

[network]
network_backend = "netavark"
# A published port binds to loopback unless the client names an address: Testcontainers asks for HostIp "" (every address), and the session's VPC
# interface would then expose the test database to other microVMs (ham-services binds 127.0.0.1 only for the same reason).
default_host_ips = ["127.0.0.1"]
# The kernel has no usable netfilter for a userns netns and the ports are published by rootlessport, so netavark adds no rules.
firewall_driver = "none"

# gitleaks configuration for images/codebuild/image-secret-scan.yml. The scan starts from gitleaks' built-in rules. The entries below name the few files
# that come unchanged from a hash-pinned upstream download (the Go, JDK and RabbitMQ archives installed by images/tools/lang/install.sh and
# images/worker-python/install-broker.sh) and that hold public documentation or test data the built-in rules mistake for a key. The bytes of each
# archive are fixed by its sha256 in lang.lock or broker.lock, so these files cannot hold a value the harness put there. Every path is one file or one
# upstream source tree; nothing the harness writes (bin, the agentd and gate binaries, /etc, /home, /root, the image configuration) is covered.
title = "worker image secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "Go standard library source: crypto and TLS test vectors (private keys and key-like constants published with the Go release archive, lang.lock hash)"
paths = ['''^/opt/harness/gate-tools/lang/go/src/''']

[[allowlists]]
description = "RabbitMQ management plugin: the HTTP API reference page shows curl examples with the documented guest:guest user (rabbitmq-server 3.13.7 archive, broker.lock hash)"
paths = ['''^/opt/harness/services/rabbitmq/plugins/rabbitmq_management-[0-9.]+/priv/www/api/index\.html$''']

[[allowlists]]
description = "JDK security configuration: java.security sets jdk.tls.keyLimits (TLS 1.3 key-update limits for AES/GCM and ChaCha20-Poly1305), which the generic key rule reads as a key value (Corretto archive, lang.lock hash)"
paths = ['''^/opt/harness/gate-tools/lang/jdk/conf/security/java\.security$''']

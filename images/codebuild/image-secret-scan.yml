# CodeBuild ARM (hamh-<stage>-image-build): the secret scan of a runtime image. Run with
#   scripts/codebuild-run.sh --buildspec images/codebuild/image-secret-scan.yml --stage direct --env IMAGE_URI=<repo>@<digest or :tag>
# The runtime base role can pull the stage's runtime images and the metadata service hands that role's credentials to the engine's uid, so the
# image must hold no secret. The scan uses the image's own pinned gitleaks (/opt/harness/gate-tools/bin/gitleaks) on the directories the harness adds,
# on the image configuration (environment, labels, entry point) and on the build history; any finding fails the build and prints
# IMAGE-SECRET-SCAN FAIL, a clean scan prints IMAGE-SECRET-SCAN PASS (a scan that writes no report counts as 1,000 findings). It builds and pushes nothing.
# The rules are gitleaks' built-ins plus images/codebuild/image-secret-scan.gitleaks.toml, which exempts three files of hash-pinned upstream downloads
# (Go standard library test data, one RabbitMQ documentation page, java.security) and nothing the harness writes.
version: 0.2
phases:
  build:
    commands:
      - . scripts/lib/child-build-env.sh
      - test "$(uname -m)" = aarch64
      - test -n "$IMAGE_URI"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${IMAGE_URI%%/*}"
      - docker pull "$IMAGE_URI"
      - mkdir -p meta reports
      - docker inspect "$IMAGE_URI" > meta/inspect.json
      - docker history --no-trunc --format '{{.CreatedBy}}' "$IMAGE_URI" > meta/history.txt
      - >-
        FINDINGS=0;
        for d in /opt/harness /etc /home /root /usr/local /var/lib /srv /mnt; do
        N=$(echo "$d" | tr '/' '_');
        docker run --rm --entrypoint /opt/harness/gate-tools/bin/gitleaks -v "$PWD/reports:/reports" -v "$PWD/images/codebuild/image-secret-scan.gitleaks.toml:/scan.toml:ro" "$IMAGE_URI" dir "$d" --config /scan.toml --no-banner --redact --report-format json --report-path "/reports/fs$N.json" > "reports/fs$N.log" 2>&1 || true;
        C=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "reports/fs$N.json" 2>/dev/null || echo 1000);
        echo "scanned $d findings=$C"; FINDINGS=$((FINDINGS + C));
        done;
        docker run --rm --entrypoint /opt/harness/gate-tools/bin/gitleaks -v "$PWD/meta:/meta:ro" -v "$PWD/reports:/reports" -v "$PWD/images/codebuild/image-secret-scan.gitleaks.toml:/scan.toml:ro" "$IMAGE_URI" dir /meta --config /scan.toml --no-banner --redact --report-format json --report-path /reports/meta.json > reports/meta.log 2>&1 || true;
        C=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' reports/meta.json 2>/dev/null || echo 1000);
        echo "scanned image configuration and build history findings=$C"; FINDINGS=$((FINDINGS + C));
        if [ "$FINDINGS" -eq 0 ]; then echo "IMAGE-SECRET-SCAN PASS findings=0 image=$IMAGE_URI"; else echo "IMAGE-SECRET-SCAN FAIL findings=$FINDINGS image=$IMAGE_URI"; for f in reports/*.json; do python3 -c 'import json,sys; [print(" ", x.get("RuleID"), x.get("File"), x.get("StartLine")) for x in json.load(open(sys.argv[1]))]' "$f" 2>/dev/null || true; done; exit 1; fi

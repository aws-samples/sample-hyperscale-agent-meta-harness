version = "1.9.2"
url = "https://github.com/cargo-lambda/cargo-lambda/releases/download/v1.9.2/cargo-lambda-v1.9.2.x86_64-unknown-linux-musl.tar.gz"
sha256 = "b5c258c424ebaef39541c3641f33c51137ee6c426016f365628fedb2c737271d"

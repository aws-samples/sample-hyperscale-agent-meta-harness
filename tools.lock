# Toolchain pins of a Linux build host. They install under HAMH_TOOLS (the tools folder of the build host); nothing under /usr or /opt.
# Host: x86_64 Linux with glibc 2.26 or later, so static musl builds are preferred.
# Every sha256 below was computed from the download on 2026-09-25 (cargo-audit and osv-scanner on
# 2026-09-26) and matched the upstream checksum file or the GitHub release asset digest, except
# awscli (GPG .sig published, no checksum file).
schema = "1"

[rust]
toolchain = "1.98.1"
components = ["rustfmt", "clippy", "llvm-tools-preview"]
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]

[node]
# Node runs only inside [containers].node through scripts/node.sh (host glibc 2.26 < 2.28).
pnpm = "12.6.0"
pnpm_integrity = "sha512-PvaPlRyxEawgS0paFvCy3fDaVqluBBPoHYVdnwtV75JnFHCQKOHNAMQFwsX7e56OxNxGd3yAXQNzwvL/AP0g7A=="
aws_cdk = "2.1143.0"
aws_cdk_integrity = "sha512-bTbgEmNuN6UMDAyhGFWOAnriafSu7j0cAjaFKRw1/WEs6RE5g062D2v2+YE8Dw6qw7RgNGQPH5Nv47TsK5kZSQ=="

[containers]
node = "node:22-bookworm@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d"
binfmt = "tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0"
# linux/arm64 manifest of alpine:3.22; runs only through QEMU binfmt on this x86_64 host.
hello_arm64 = "alpine:3.22@sha256:2e1a7aa4cbc4e9e5222bb4c24a839aa1a6170ea5492d644777ce7b178824e44f"
# linux/arm64 child manifest of the index that images/worker-python/Dockerfile builds FROM (amazonlinux:2023@sha256:381352c4...).
# scripts/lib/arm64_sysroot.py copies the glibc 2.34 loader and libraries out of it so the production aarch64 agentd runs on
# this x86_64 host under QEMU.
al2023_arm64 = "public.ecr.aws/amazonlinux/amazonlinux@sha256:6b60f399998548f63d564a8591eb9493a1aed0d6ef447db83b9ea884ed82065d"

[gate_tools]
# gate tool set (images/tools/install.sh) at HAMH_TOOLS/gate-tools: this
# CPython (installed by the pinned uv under HAMH_TOOLS/python), the tools.txt venv, the runtime.txt
# wheels, and these tools from the [[tool]] entries. The worker image uses its own python3.12.
python = "3.12.11"
tools = ["uv", "gitleaks"]

[[tool]]
name = "rustup-init"
version = "1.29.1"
url = "https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init"
sha256 = "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71"
kind = "binary"
bin = ["rustup-init"]

